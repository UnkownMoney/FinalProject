<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Flashcard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Edit Flashcard</h1>
    <form id="edit-form">
      <input type="text" id="edit-question" placeholder="Edit question" required>
      <input type="text" id="edit-answer" placeholder="Edit answer" required>
      <button type="submit">Update Card</button>
    </form>
    <a href="/view-cards">Back to All Cards</a>
  </div>
  <script src="/edit-card.js"></script>
</body>
</html>
