<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Flashcard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="edit-page">
  <div class="edit-card-container">
    <h1>Edit Flashcard</h1>
    <form id="edit-card-form">
      <input type="hidden" id="card-id">
      
      <div class="form-group">
        <label>Question</label>
        <textarea id="edit-question" required>10 + 10 =</textarea>
      </div>
      
      <div class="form-group">
        <label>Answer</label>
        <textarea id="edit-answer" required>20</textarea>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Card</button>
        <a href="/view-cards" class="btn btn-secondary">Back to All Cards</a>
      </div>
    </form>
  </div>
  <script src="/edit-card.js"></script>
</body>
</html>
