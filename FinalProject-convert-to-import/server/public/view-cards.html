<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Flashcards</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>
        <i class="fas fa-layer-group"></i> My Flashcards
      </h1>
      <div class="header-actions">
        <a href="/add-card" class="nav-link">
          <i class="fas fa-plus-circle"></i> Add New
        </a>
        <a href="/study-mode" class="nav-link">
          <i class="fas fa-book-open"></i> Study Mode
        </a>
      </div>
    </header>

    <main>
      <section class="flashcards-section">
        <div class="card-counter">
          <span id="card-count">0</span> cards
        </div>
        <div id="flashcard-list" class="card-container">
          <div class="loading-message">Loading flashcards...</div>
        </div>
      </section>
    </main>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <p id="modal-message">Are you sure you want to delete this flashcard?</p>
      <div class="modal-buttons">
        <button id="confirm-cancel" class="modal-btn cancel-btn">Cancel</button>
        <button id="confirm-delete" class="modal-btn delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let flashcards = [];
      let cardToDelete = null;

      async function loadFlashcards() {
        try {
          document.getElementById('flashcard-list').innerHTML = 
            '<div class="loading-message">Loading flashcards...</div>';
          
          const response = await fetch('/api/flashcards');
          
          if (!response.ok) {
            const errorMsg = response.status === 500 
              ? 'Server error. Please try again later.' 
              : `Error: ${response.status}`;
            throw new Error(errorMsg);
          }
          
          flashcards = await response.json();
          renderFlashcards();
        } catch (err) {
          console.error('Error loading flashcards:', err);
          document.getElementById('flashcard-list').innerHTML = 
            `<div class="error-message">
              <i class="fas fa-exclamation-triangle"></i>
              ${err.message}
              <button onclick="location.reload()" class="retry-btn">
                <i class="fas fa-sync-alt"></i> Try Again
              </button>
            </div>`;
        }
      }

      function renderFlashcards() {
        const container = document.getElementById('flashcard-list');
        
        if (flashcards.length === 0) {
          container.innerHTML = '<div class="empty-message">No flashcards found</div>';
          document.getElementById('card-count').textContent = '0';
          return;
        }

        document.getElementById('card-count').textContent = flashcards.length;
        
        container.innerHTML = flashcards.map(card => `
          <div class="flashcard" data-id="${card.id}">
            <div class="card-content">
              <div class="card-question">${card.question}</div>
              <div class="card-answer">${card.answer}</div>
              <div class="card-actions">
                <button class="edit-btn" data-id="${card.id}">
                  <i class="fas fa-edit"></i> Edit
                </button>
                <button class="delete-btn" data-id="${card.id}">
                  <i class="fas fa-trash-alt"></i> Delete
                </button>
              </div>
              ${card.created_at ? `
              <div class="card-meta">
                <small>Created: ${new Date(card.created_at).toLocaleString()}</small>
                ${card.updated_at && card.updated_at !== card.created_at ? 
                  `<small> | Updated: ${new Date(card.updated_at).toLocaleString()}</small>` : ''}
              </div>
              ` : ''}
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            cardToDelete = e.target.closest('.flashcard').dataset.id;
            document.getElementById('modal-message').textContent = 
              'Are you sure you want to delete this flashcard?';
            document.getElementById('confirm-modal').classList.remove('hidden');
          });
        });

        document.querySelectorAll('.edit-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const cardId = e.target.closest('.flashcard').dataset.id;
            window.location.href = `/edit-card?id=${cardId}`;
          });
        });
      }

      document.getElementById('confirm-cancel').addEventListener('click', () => {
        document.getElementById('confirm-modal').classList.add('hidden');
      });

      document.getElementById('confirm-delete').addEventListener('click', async () => {
        try {
          const response = await fetch(`/api/flashcards/${cardToDelete}`, {
            method: 'DELETE'
          });
          
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          
          await loadFlashcards();
          document.getElementById('confirm-modal').classList.add('hidden');
        } catch (err) {
          console.error('Error deleting flashcard:', err);
          document.getElementById('modal-message').textContent = 
            `Error deleting flashcard: ${err.message}`;
        }
      });

      await loadFlashcards();
    });
  </script>
</body>
</html>
