<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Flashcards</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>
        <i class="fas fa-layer-group"></i> My Flashcards
      </h1>
      <div class="header-actions">
        <a href="/add-card" class="nav-link">
          <i class="fas fa-plus-circle"></i> Add New
        </a>
        <a href="/study-mode" class="nav-link">
          <i class="fas fa-book-open"></i> Study Mode
        </a>
      </div>
    </header>

    <main>
      <section class="flashcards-section">
        <div class="card-counter">
          <span id="card-count">0</span> cards
        </div>
        <div id="flashcard-list" class="card-container">
          <!-- Flashcards will be dynamically inserted here -->
        </div>
      </section>
    </main>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <p id="modal-message">Are you sure you want to delete this flashcard?</p>
      <div class="modal-buttons">
        <button id="confirm-cancel" class="modal-btn cancel-btn">Cancel</button>
        <button id="confirm-delete" class="modal-btn delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
