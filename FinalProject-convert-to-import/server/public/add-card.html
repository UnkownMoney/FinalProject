<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Flashcards</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>
        <i class="fas fa-plus-circle"></i> Add New Flashcards
      </h1>
      <a href="/view-cards" class="nav-link">
        <i class="fas fa-layer-group"></i> View All Cards
      </a>
    </header>

    <main>
      <section class="create-section card-style">
        <form id="flashcard-form" action="/add-card" method="POST">
          <div class="form-group">
            <label for="question"><i class="fas fa-question-circle"></i> Question</label>
            <input type="text" id="question" name="question" placeholder="Enter your question..." required />
          </div>
          <div class="form-group">
            <label for="answer"><i class="fas fa-lightbulb"></i> Answer</label>
            <textarea id="answer" name="answer" placeholder="Enter the answer..." rows="4" required></textarea>
          </div>
          <button type="submit" class="submit-btn">
            <i class="fas fa-save"></i> Add Flashcard
          </button>
        </form>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
