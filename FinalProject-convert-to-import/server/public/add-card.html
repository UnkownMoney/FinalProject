<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Flashcard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="card-form-container">
      <h1>Add New Flashcard</h1>
      
      <!-- Added novalidate to disable browser validation -->
      <form id="add-card-form" class="flashcard-form" novalidate>
        <div class="form-group">
          <label for="question">Question:</label>
          <textarea 
            id="question" 
            name="question" 
            placeholder="Enter your question (max 100 words)..." 
            
          ></textarea>
          <div class="word-counter" id="question-word-counter">0/100 words</div>
          <!-- Error message container -->
          <div id="question-error" class="error-message"></div>
        </div>
        
        <div class="form-group">
          <label for="answer">Answer:</label>
          <textarea 
            id="answer" 
            name="answer" 
            placeholder="Enter the answer (max 100 words)..." 
           
          ></textarea>
          <div class="word-counter" id="answer-word-counter">0/100 words</div>
          <!-- Error message container -->
          <div id="answer-error" class="error-message"></div>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <span class="btn-icon">+</span> Add Card
          </button>
          <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Changed to add-card.js since we're using custom validation -->
  <script src="/add-card.js"></script>
</body>
</html>
