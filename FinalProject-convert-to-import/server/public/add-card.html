<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Flashcard</title>
    <!-- Make sure this path is correct -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="form-container">
        <h1>Add New Flashcard</h1>
        
        <form id="flashcard-form">
            <div class="form-group">
                <label for="question">Question:</label>
                <textarea id="question" class="form-control" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="answer">Answer:</label>
                <textarea id="answer" class="form-control" required></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">Add Flashcard</button>
        </form>
        
        <a href="/" class="btn">Back to Home</a>
    </div>
    
    <script src="/scripts/add-card.js"></script>
</body>
</html>
