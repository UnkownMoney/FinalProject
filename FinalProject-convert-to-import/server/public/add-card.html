<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Flashcard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Add a New Flashcard</h1>
    <form id="add-form">
      <input type="text" id="question" placeholder="Enter question" required>
      <input type="text" id="answer" placeholder="Enter answer" required>
      <button type="submit">Add Card</button>
    </form>
    <a href="/">Back to Home</a>
  </div>
  <script src="/add-card.js"></script>
</body>
</html>
