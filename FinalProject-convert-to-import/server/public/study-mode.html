<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Mode</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="study-container">
    <div class="card-counter">
      <span id="card-position">1</span> / <span id="total-cards">0</span>
    </div>
    
    <div class="flashcard-container">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-front" id="study-question">
          <!-- Question appears here -->
        </div>
        <div class="flashcard-back" id="study-answer">
          <!-- Answer appears here -->
        </div>
      </div>
    </div>
    
    <div class="quizlet-controls">
      <button id="flip-card" class="control-btn flip">Show Answer</button>
      <button id="next-card" class="control-btn next">Next Card</button>
      <button id="exit-study" class="control-btn exit">Exit</button>
    </div>
  </div>
  
  <script src="/script.js"></script>
</body>
</html>
