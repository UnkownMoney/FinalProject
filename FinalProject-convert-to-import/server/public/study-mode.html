<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Mode</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="study-container">
    <!-- Card counter at top -->
    <div class="card-counter">
      <span id="card-position">1</span> / <span id="total-cards">14</span>
    </div>
    
    <!-- Main flashcard area -->
    <div class="quizlet-flashcard" id="flashcard">
      <div class="flashcard-inner">
        <div class="flashcard-front" id="study-question">
          <!-- Question will appear here -->
        </div>
        <div class="flashcard-back" id="study-answer">
          <!-- Answer will appear here -->
        </div>
      </div>
    </div>
    
    <!-- Control buttons -->
    <div class="quizlet-controls">
      <button id="flip-card" class="control-btn flip">Show Answer</button>
      <button id="next-card" class="control-btn next">Next Card</button>
      <button id="exit-study" class="control-btn exit">Exit</button>
    </div>
  </div>
  
  <script src="/home.js"></script>
</body>
</html>
